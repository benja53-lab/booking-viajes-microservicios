version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: mysql-booking
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - booking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-eureka-server:
    build: ./ms-eureka-server
    container_name: ms-eureka-server
    ports:
      - "8761:8761"
    networks:
      - booking-network

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_usuarios?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      ms-eureka-server:
        condition: service_started
    networks:
      - booking-network

  ms-hoteles:
    build: ./ms-hoteles
    container_name: ms-hoteles
    ports:
      - "8082:8082"
